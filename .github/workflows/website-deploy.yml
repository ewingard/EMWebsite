name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout website
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Calculate issue information
      # ------------------------------------------------------------

      - name: Calculate issue information
        id: issue
        env:
          PUSH_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          YEAR=$(date -u -d "$PUSH_DATE" +%Y)
          DATE=$(date -u -d "$PUSH_DATE" +%Y-%m-%d)

          # 2026 = Volume 1
          # 2027 = Volume 2
          # 2028 = Volume 3
          VOLUME=$((YEAR - 2026 + 1))

          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "volume=$VOLUME" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          echo "Publication:"
          echo "  Year:   $YEAR"
          echo "  Volume: $VOLUME"
          echo "  Issue:  1"
          echo "  Date:   $DATE"

      # ------------------------------------------------------------
      # Generate issue.json
      #
      # This file does NOT need to exist in the repository.
      # It is generated during deployment.
      # ------------------------------------------------------------

      - name: Generate issue.json
        env:
          YEAR: ${{ steps.issue.outputs.year }}
          VOLUME: ${{ steps.issue.outputs.volume }}
          DATE: ${{ steps.issue.outputs.date }}
        run: |
          cat > issue.json << EOF
          {
            "year": $YEAR,
            "volume": $VOLUME,
            "issue": 1,
            "date": "$DATE"
          }
          EOF

          echo "Generated issue.json:"
          cat issue.json

      # ------------------------------------------------------------
      # Verify that issue.json exists
      # ------------------------------------------------------------

      - name: Verify website files
        run: |
          echo "Website root:"
          ls -la

          echo ""
          echo "issue.json:"
          cat issue.json

      # ------------------------------------------------------------
      # Configure GitHub Pages
      # ------------------------------------------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # Upload website
      # issue.json is included because it is in the root.
      # ------------------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # ------------------------------------------------------------
      # Deploy website
      # ------------------------------------------------------------

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4