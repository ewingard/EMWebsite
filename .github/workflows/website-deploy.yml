name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read   # count past deployments

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout website
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Calculate issue information
      # ------------------------------------------------------------

      - name: Calculate issue information
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          YEAR=$(date -u +%Y)
          DATE=$(date -u +%Y-%m-%d)

          # 2026 = Volume 1, 2027 = Volume 2, ...
          VOLUME=$((YEAR - 2026 + 1))

          # Count successful Pages deployments created this year.
          # (Older deployments get marked "inactive" once superseded,
          # so check whether ANY status was "success", not just the latest.)
          PRIOR=$(
            gh api --paginate \
              "repos/$REPO/deployments?environment=github-pages&per_page=100" \
              --jq ".[] | select(.created_at | startswith(\"$YEAR\")) | .id" |
            while read -r id; do
              OK=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=100" \
                     --jq 'any(.[]; .state == "success")')
              if [ "$OK" = "true" ]; then echo "$id"; fi
            done | wc -l
          )

          ISSUE=$((PRIOR + 1))

          echo "year=$YEAR"     >> "$GITHUB_OUTPUT"
          echo "volume=$VOLUME" >> "$GITHUB_OUTPUT"
          echo "issue=$ISSUE"   >> "$GITHUB_OUTPUT"
          echo "date=$DATE"     >> "$GITHUB_OUTPUT"

          echo "Vol. $VOLUME, Issue $ISSUE ($DATE)"

      - name: Generate issue.json
        env:
          YEAR: ${{ steps.issue.outputs.year }}
          VOLUME: ${{ steps.issue.outputs.volume }}
          ISSUE: ${{ steps.issue.outputs.issue }}
          DATE: ${{ steps.issue.outputs.date }}
        run: |
          cat > issue.json << EOF
          {
            "year": $YEAR,
            "volume": $VOLUME,
            "issue": $ISSUE,
            "date": "$DATE"
          }
          EOF

          cat issue.json

      # ------------------------------------------------------------
      # Verify that issue.json exists
      # ------------------------------------------------------------

      - name: Verify website files
        run: |
          echo "Website root:"
          ls -la

          echo ""
          echo "issue.json:"
          cat issue.json

      # ------------------------------------------------------------
      # Configure GitHub Pages
      # ------------------------------------------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # Upload website
      # issue.json is included because it is in the root.
      # ------------------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # ------------------------------------------------------------
      # Deploy website
      # ------------------------------------------------------------

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4